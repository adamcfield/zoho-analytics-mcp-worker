name: Deploy

# Standard fleet deploy (DevOps, 2026-11-02). Tests, then `wrangler deploy` for each worker
# in this repo, to the personal Cloudflare account. CLOUDFLARE_API_TOKEN is one repo secret
# that sees several accounts, so the account id is pinned here (an account id is not a secret).
# Worker secrets live on Cloudflare and are untouched by a deploy.
# Auto-deploys every push to main (Adam, 2026-11-02); manual dispatch can redeploy one worker.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  workflow_dispatch:
    inputs:
      target:
        description: Which worker to deploy
        type: choice
        options: [all, bearer, oauth]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c12e34b24c2857ab93bda8c4b529db5f
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy zoho-analytics-mcp
        if: inputs.target == 'all' || inputs.target == 'bearer' || github.event_name == 'push'
        run: npx wrangler deploy
      - name: Deploy zoho-analytics-mcp-oauth
        if: inputs.target == 'all' || inputs.target == 'oauth' || github.event_name == 'push'
        run: npx wrangler deploy -c wrangler.oauth.jsonc
