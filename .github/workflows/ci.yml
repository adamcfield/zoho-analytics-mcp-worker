name: CI

on:
  push:
    paths-ignore: ["**.md", "LICENSE", ".dev.vars.example"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".dev.vars.example"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Aligned with deploy.yml: wrangler 4.x requires Node >= 22.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --check scripts/smoke.mjs
      - run: node --check scripts/live-test.mjs
      # Bundle both workers: catches unresolvable imports (e.g. a missing
      # `agents` peer) that typecheck and unit tests cannot see.
      - run: npx wrangler deploy --dry-run --outdir dist/bearer
      - run: npx wrangler deploy --dry-run -c wrangler.oauth.jsonc --outdir dist/oauth
